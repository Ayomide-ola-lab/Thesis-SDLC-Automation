[project]
name = "autodoc-v6"
version = "6.3.0"
description = "Automating SDLC Process Documentation through Retrieval and Synthesis of Software Artefacts Using an Agentic LLM-RAG Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
